name: packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  # Only the commits this push or PR adds -- history predates the
  # convention. The rule lives in .githooks/commit-msg so the hook a
  # developer installs and the gate CI applies cannot drift.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Subjects follow Conventional Commits
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            echo "no base to compare against; checking HEAD only"
            base="HEAD~1"
          fi
          git rev-list "$base..HEAD" | while read -r sha; do
            git log -1 --format=%B "$sha" >/tmp/msg
            echo "-- $(git log -1 --format='%h %s' "$sha")"
            bash .githooks/commit-msg /tmp/msg
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - run: pytest -q

  # One job per distro, all running the same script a developer runs:
  # packaging/check.sh builds the right format for the image, lints it
  # with that distro's official linter, installs it, and proves the
  # realtime connect() call is well formed against whatever websockets
  # that distro ships. Adding a distro is one line here.
  packages:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:stable, ubuntu:24.04, ubuntu:25.04, fedora:latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build, lint, install and run on ${{ matrix.image }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          CONTAINER=docker packaging/check.sh "${{ matrix.image }}"
      # The packages are format-specific, not distro-specific: one deb
      # and one rpm are what ship, built on the canonical image for each.
      - uses: actions/upload-artifact@v4
        if: matrix.image == 'debian:stable' || matrix.image == 'fedora:latest'
        with:
          name: pkg-${{ strategy.job-index }}
          path: |
            dist/*.deb
            dist/noarch/*.rpm
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The release page gets the same history the packages carry, from
      # the same source: the spec's %changelog. A hand-written note and
      # an auto-generated commit list are both worse than the one the
      # release was already described by.
      - name: Release notes from the changelog
        run: |
          python3 packaging/spec2changelog.py packaging/dictatr.spec \
            --markdown --version "${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          # Appends the commit/PR list under our notes, rather than
          # instead of them.
          generate_release_notes: true
