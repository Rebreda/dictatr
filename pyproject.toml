[project]
name = "dictatr"
version = "0.3.0"
description = "Hotkey voice dictation for Linux desktops, backed by a local Lemonade Whisper server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "websockets>=12",
]

[project.scripts]
dictatr = "dictatr.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictatr"]
