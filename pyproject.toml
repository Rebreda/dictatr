[project]
name = "dictatr"
version = "0.5.0"
description = "Hotkey voice dictation for Linux desktops, backed by a local Lemonade Whisper server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "websockets>=10",
]

[project.scripts]
dictatr = "dictatr.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# ui/ is not a package (the surfaces are scripts run through bin/), but
# ui/radial_layout.py is pure arithmetic with no GTK in it, so it can be
# tested like anything else.
pythonpath = ["ui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictatr"]
