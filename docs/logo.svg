<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- dictatr: the expanded radial menu, simplified.
       Dark bubbles on a dotted orbit, mic hub, one live record bubble. -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#8ab4f8" stroke-opacity="0.28"
          stroke-width="2" stroke-dasharray="0.5 10.9" stroke-linecap="round"/>

  <!-- satellites (top, then clockwise) -->
  <g fill="#1c1d22" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5">
    <circle cx="64" cy="20" r="10"/>
    <circle cx="102.1" cy="42" r="10"/>
    <circle cx="102.1" cy="86" r="10"/>
    <circle cx="64" cy="108" r="10"/>
    <circle cx="25.9" cy="42" r="10"/>
  </g>
  <!-- the record bubble, live -->
  <circle cx="25.9" cy="86" r="10" fill="#81c995" fill-opacity="0.22"
          stroke="#81c995" stroke-width="1.5"/>
  <circle cx="25.9" cy="86" r="4" fill="#81c995"/>

  <!-- hub with mic -->
  <circle cx="64" cy="64" r="18" fill="#1c1d22" stroke="#ffffff"
          stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="59.5" y="52.5" width="9" height="15" rx="4.5" fill="#8ab4f8"/>
  <path d="M55 63 a9 9 0 0 0 18 0" fill="none" stroke="#8ab4f8"
        stroke-width="2.6" stroke-linecap="round"/>
  <path d="M64 72 v4" stroke="#8ab4f8" stroke-width="2.6" stroke-linecap="round"/>
</svg>
